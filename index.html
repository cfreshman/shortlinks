<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shortlinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Noto+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style id="theme-vars"></style>
</head>
<body>
  <div class="container">
    <h1>shortlinks</h1>
    <p class="subtitle">self-hosted URL shortener</p>
    
    <form id="shortlinkForm">
      <div class="form-group">
        <label for="url">long url</label>
        <input 
          type="url" 
          id="url" 
          placeholder="https://example.com/very/long/url" 
          required 
          autofocus
        >
        <div class="error" id="error"></div>
      </div>
      
      <div class="form-group">
        <label for="custom">custom short code (optional)</label>
        <input 
          type="text" 
          id="custom" 
          placeholder="my-link" 
          pattern="[a-zA-Z0-9_-]+"
        >
      </div>
      
      <div class="button-group">
        <button type="submit">shorten</button>
        <button type="button" class="secondary" onclick="document.getElementById('shortlinkForm').reset(); document.getElementById('result').classList.remove('show')">clear</button>
      </div>
    </form>
    
    <div class="result" id="result">
      <div class="result-label">short link</div>
      <div class="short-url" id="shortUrl"></div>
      <button class="copy-btn" id="copyBtn">copy to clipboard</button>
    </div>
    
    <div class="links-list">
      <h2 class="links-title">recent links</h2>
      <input 
        type="text" 
        id="searchInput" 
        placeholder="search links..." 
        class="search-input"
      >
      <div id="linksList"></div>
    </div>
  </div>
  
  <script src="/client.js"></script>
</body>
</html>
